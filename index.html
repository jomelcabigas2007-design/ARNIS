<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arnis Repository</title>
  <style>
    :root {
      --bg-deep: #1d140f;
      --bg-olive: #4a5f3e;
      --bg-moss: #70885d;
      --bg-brown: #77563d;
      --leaf-1: #d8e9b5;
      --leaf-2: #c7d5a1;
      --leaf-3: #b65c87;
      --bud-top: #ef6a42;
      --bud-mid: #f29a51;
      --bud-bottom: #ef4f3d;
      --shadow: rgba(0, 0, 0, 0.24);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #2b1f17 0%, #4d593d 28%, #7b6d52 58%, #1e2a24 100%);
      overflow: hidden;
      color: #f7f4ee;
    }

    body {
      display: flex;
      align-items: stretch;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,0.08), transparent 32%),
        linear-gradient(180deg, rgba(25, 19, 15, 0.12), rgba(14, 16, 16, 0.28));
    }

    .scene::before,
    .scene::after {
      content: "";
      position: absolute;
      inset: auto;
      border-radius: 50%;
      filter: blur(30px);
      opacity: 0.5;
      pointer-events: none;
    }

    .scene::before {
      width: 56vw;
      height: 56vw;
      left: -10vw;
      bottom: -10vw;
      background: rgba(128, 131, 79, 0.32);
    }

    .scene::after {
      width: 60vw;
      height: 60vw;
      right: -10vw;
      top: -8vw;
      background: rgba(127, 65, 104, 0.28);
    }

    .leaf {
      position: absolute;
      display: block;
      background: linear-gradient(135deg, rgba(236, 245, 207, 0.9), rgba(181, 198, 148, 0.9) 42%, rgba(164, 176, 122, 0.95));
      border-radius: 100% 0 100% 0 / 100% 0 100% 0;
      box-shadow: inset -10px -12px 18px rgba(74, 90, 36, 0.15), inset 8px 10px 10px rgba(255,255,255,0.18);
      transform-origin: center;
      filter: blur(0.4px);
    }

    .leaf::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(255,255,255,0.32), transparent 42%, rgba(97, 89, 29, 0.12));
    }

    .leaf.l1 { width: 190px; height: 52px; left: 50%; top: 52%; transform: translate(-12%, 0) rotate(52deg); }
    .leaf.l2 { width: 220px; height: 58px; left: 57%; top: 62%; transform: translate(-20%, 0) rotate(34deg); }
    .leaf.l3 { width: 210px; height: 52px; left: 32%; top: 55%; transform: translate(-50%, 0) rotate(-42deg); }
    .leaf.l4 { width: 240px; height: 60px; left: 40%; top: 62%; transform: translate(-50%, 0) rotate(-12deg); }
    .leaf.l5 { width: 190px; height: 48px; left: 58%; top: 48%; transform: translate(-40%, 0) rotate(72deg); }

    .bloom {
      position: absolute;
      left: 50%;
      top: 52%;
      width: min(32vw, 420px);
      height: min(32vw, 420px);
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 18px 22px rgba(25, 12, 8, 0.18));
      z-index: 2;
    }

    .bud {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42%;
      height: 42%;
      transform: translate(-50%, -50%) rotate(6deg);
      border-radius: 56% 44% 57% 43% / 59% 57% 43% 41%;
      background: radial-gradient(circle at 30% 30%, #f7b56d 0%, var(--bud-mid) 18%, var(--bud-top) 42%, var(--bud-bottom) 76%, #d94036 100%);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.15),
        inset -14px -12px 22px rgba(128, 31, 21, 0.3),
        0 8px 18px rgba(32, 18, 12, 0.18);
      overflow: visible;
    }

    .bud::before,
    .bud::after {
      content: "";
      position: absolute;
      inset: auto;
      border-radius: 58% 42% 60% 40% / 53% 47% 53% 47%;
      background: linear-gradient(135deg, rgba(255, 195, 128, 0.9), rgba(246, 108, 72, 0.9) 35%, rgba(214, 60, 44, 0.95));
      box-shadow: inset -5px -12px 18px rgba(162, 41, 29, 0.25);
    }

    .bud::before {
      width: 78%;
      height: 78%;
      left: 11%;
      top: -16%;
      transform: rotate(-34deg);
    }

    .bud::after {
      width: 76%;
      height: 76%;
      right: -10%;
      bottom: 8%;
      transform: rotate(28deg);
    }

    .bud-core {
      position: absolute;
      inset: 18% 21% 16% 22%;
      border-radius: 58% 42% 58% 42% / 54% 46% 54% 46%;
      background: radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.24) 0%, rgba(254, 214, 92, 0.18) 12%, rgba(218, 121, 40, 0.02) 60%, transparent 100%);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.06);
    }

    .stem {
      position: absolute;
      width: 10px;
      height: 110px;
      left: 50%;
      top: 58%;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(180deg, #d9f9a5 0%, #dce89f 32%, #b9c86a 100%);
      box-shadow: 0 0 12px rgba(139, 170, 78, 0.28);
      z-index: 1;
    }

    .stem::before,
    .stem::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 76px;
      border-radius: 50% 50% 50% 0;
      background: linear-gradient(180deg, rgba(214, 231, 152, 0.9), rgba(162, 188, 107, 0.9));
      box-shadow: inset 0 0 0 1px rgba(75, 73, 58, 0.1);
    }

    .stem::before {
      left: -42px;
      top: 18px;
      transform: rotate(-36deg);
    }

    .stem::after {
      right: -34px;
      top: 20px;
      transform: rotate(38deg);
    }

    .title-box {
      position: absolute;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      padding: 10px 26px 12px;
      border-radius: 999px;
      background: rgba(18, 21, 25, 0.32);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-weight: 700;
      font-size: 12px;
      color: rgba(246, 242, 236, 0.9);
      text-align: center;
      white-space: nowrap;
    }

    .ground-glow {
      position: absolute;
      left: 50%;
      bottom: 4%;
      transform: translateX(-50%);
      width: 68vw;
      height: 18vh;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(51, 73, 77, 0.42) 0%, rgba(16, 20, 24, 0.1) 58%, rgba(16,20,24,0) 80%);
      filter: blur(14px);
      z-index: 0;
    }

    @media (max-width: 700px) {
      .bloom {
        width: min(58vw, 320px);
        height: min(58vw, 320px);
        top: 55%;
      }

      .leaf.l1 { width: 120px; height: 34px; }
      .leaf.l2 { width: 150px; height: 38px; }
      .leaf.l3 { width: 130px; height: 34px; }
      .leaf.l4 { width: 150px; height: 38px; }
      .leaf.l5 { width: 120px; height: 32px; }

      .title-box {
        letter-spacing: 0.12em;
        font-size: 10px;
        padding: 9px 18px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="scene" aria-label="Flower background">
    <div class="title-box">Arnis Repository</div>

    <div class="ground-glow"></div>

    <div class="leaf l1"></div>
    <div class="leaf l2"></div>
    <div class="leaf l3"></div>
    <div class="leaf l4"></div>
    <div class="leaf l5"></div>

    <div class="bloom" aria-hidden="true">
      <div class="stem"></div>
      <div class="bud">
        <div class="bud-core"></div>
      </div>
    </div>
  </div>
</body>
</html>
